<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screen Light+">
<meta name="theme-color" content="#000000">
<title>Screen Light+</title>
<style>
:root{
  --panel:rgba(18,18,20,.82);
  --fg:#f5f5f2;
  --dim:rgba(245,245,242,.58);
  --line:rgba(255,255,255,.14);
  --chip:rgba(255,255,255,.1);
  --rec:#ff3b30;
  --accent:#ffc35a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--fg);
  font:15px/1.3 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 整个屏幕就是灯 */
#light{position:fixed;inset:0;background:#fff}

/* 提词器 */
#prompter{position:fixed;left:0;right:0;top:0;z-index:3;
  height:calc(env(safe-area-inset-top,0px) + 30vh);
  padding:calc(env(safe-area-inset-top,0px) + 6px) 18px 0 18px;overflow:hidden;touch-action:none;
  -webkit-mask-image:linear-gradient(#000 0,#000 78%,transparent 100%);mask-image:linear-gradient(#000 0,#000 78%,transparent 100%)}
#prompterText{white-space:pre-wrap;font-weight:600;line-height:1.35;will-change:transform;
  color:var(--ptext,rgba(0,0,0,.86));text-align:center;padding-top:2vh;padding-bottom:30vh}
#pState{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left,0px));
  top:calc(env(safe-area-inset-top,0px) + 30vh + 4px);font-size:12px;padding:4px 9px;border-radius:99px;
  background:rgba(0,0,0,.5);color:#fff;pointer-events:none}

/* 小画面 */
#pip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:27vw;max-width:170px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#111;
  box-shadow:0 6px 22px rgba(0,0,0,.35);z-index:5;touch-action:none;
  -webkit-touch-callout:none;transition:width .2s,transform .15s,box-shadow .15s}
#pip.big{width:46vw;max-width:300px}
#pip.lifted{transform:scale(1.07);box-shadow:0 14px 40px rgba(0,0,0,.5);transition:width .2s,transform .15s,box-shadow .15s}
#pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;pointer-events:none}
#pip.nomirror video{transform:none}
#recBadge{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,.55);padding:3px 7px;border-radius:99px;font-size:12px;font-variant-numeric:tabular-nums}
#recBadge i{width:7px;height:7px;border-radius:50%;background:var(--rec);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* 录制按钮 */
#recBtn{position:fixed;left:50%;transform:translateX(-50%);z-index:6;
  bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  width:68px;height:68px;border-radius:50%;border:4px solid rgba(0,0,0,.55);background:rgba(255,255,255,.35);
  display:grid;place-items:center;transition:bottom .25s}
#recBtn span{width:44px;height:44px;border-radius:50%;background:var(--rec);transition:all .2s}
#recBtn.on span{width:24px;height:24px;border-radius:6px}
body.sheet-open #recBtn{bottom:calc(env(safe-area-inset-bottom,0px) + var(--panelH,300px) + 14px)}

/* 面板 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:12px;transform:translateY(105%);transition:transform .25s}
.sheet.open{transform:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:10px;padding:3px}
.seg button{padding:7px 0;border-radius:8px;font-size:14px;color:var(--dim)}
.seg button.on{background:rgba(255,255,255,.9);color:#000;font-weight:600}
.presets{display:flex;gap:6px}
.presets button{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.presets button.active{border-color:var(--accent);color:var(--accent)}
.row{display:grid;grid-template-columns:48px 1fr 64px;align-items:center;gap:10px}
.row label{font-size:13px;color:var(--dim)}
.row output{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:28px;-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track,rgba(255,255,255,.25))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track,rgba(255,255,255,.25))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff}
#kelvin{--track:linear-gradient(90deg,#ff8a1f,#ffb46b,#ffe3c4,#fff,#dbe6ff,#b9cdff)}
#tint{--track:linear-gradient(90deg,#e46ce0,#fff,#6cd97a)}
#hue{--track:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#sat{--track:linear-gradient(90deg,#fff,var(--hueColor,#f00))}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tools button{padding:9px 0;border-radius:10px;background:var(--chip);font-size:12.5px;white-space:nowrap}
.tools button.on{background:rgba(255,195,90,.22);color:var(--accent)}

/* 提词器设置 */
#promptSheet textarea{width:100%;height:28vh;resize:none;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.35);color:var(--fg);font:15px/1.5 inherit;padding:10px 12px;-webkit-user-select:text;user-select:text}
.sheetHead{display:flex;justify-content:space-between;align-items:center}
.sheetHead b{font-size:16px}
.sheetHead button{color:var(--accent);font-weight:600;padding:4px 2px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.check input{width:18px;height:18px;accent-color:#ffc35a}
.btnRow{display:flex;gap:8px}
.btnRow button{flex:1;padding:10px 0;border-radius:10px;background:var(--chip);font-size:14px}
.btnRow .primary{background:#fff;color:#000;font-weight:600}

/* 开始页 */
#start{position:fixed;inset:0;z-index:20;background:#0d0d0e;display:grid;place-items:center;
  padding:24px max(24px,env(safe-area-inset-left,0px)) 24px max(24px,env(safe-area-inset-right,0px));text-align:center}
#start h1{font-size:30px;margin:0 0 6px;letter-spacing:.02em}
#start p{color:var(--dim);margin:0 auto 6px;max-width:30ch}
#start .bulb{width:120px;height:160px;margin:0 auto 22px;border-radius:16px;background:#fff;
  box-shadow:0 0 60px rgba(255,236,200,.55);position:relative}
#start .bulb::after{content:"";position:absolute;top:10px;right:10px;width:34px;height:46px;border-radius:6px;background:#2a2a2c}
.startBtns{display:grid;gap:10px;margin-top:22px;justify-items:center}
#goBtn{padding:14px 34px;border-radius:99px;background:#fff;color:#000;font-weight:600;font-size:16px;min-width:200px}
#lightOnlyBtn{padding:10px 20px;border-radius:99px;color:var(--fg);border:1px solid var(--line);font-size:14px;min-width:200px}
#err{color:#ff8a80;margin:14px auto 0;font-size:13px;max-width:34ch}

/* 录完预览 */
#review{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.92);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));gap:12px}
#review video{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:12px;background:#000}
#review .acts{display:flex;gap:10px}
#review .acts button,#review .acts a{flex:1;padding:13px 0;border-radius:12px;text-align:center;text-decoration:none;color:var(--fg);background:rgba(255,255,255,.12);font-size:15px}
#review .acts .primary{background:#fff;color:#000;font-weight:600}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(0,0,0,.65);color:#fff;
  padding:8px 14px;border-radius:99px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap}
#hint.show{opacity:1}
#hapticLbl{position:fixed;left:-100px;top:-100px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="sheet-open">

<div id="light"></div>

<div id="prompter" hidden><div id="prompterText"></div></div>
<div id="pState" hidden>已暂停 · 点字幕继续 · 上下拖动调位置</div>

<div id="pip" hidden>
  <video id="cam" playsinline autoplay muted></video>
  <div id="recBadge" hidden><i></i><span id="recTime">00:00</span></div>
</div>

<button id="recBtn" aria-label="录制" hidden><span></span></button>

<!-- 灯光面板 -->
<div id="panel" class="sheet open">
  <div class="seg" id="modeSeg">
    <button data-m="cct" class="on">白光 CCT</button>
    <button data-m="rgb">彩色 RGB</button>
  </div>

  <div id="cctBox" style="display:grid;gap:10px">
    <div class="presets" id="presets">
      <button data-k="2700">2700K</button>
      <button data-k="3200">3200K</button>
      <button data-k="4300">4300K</button>
      <button data-k="5600">5600K</button>
      <button data-k="6500">6500K</button>
      <button data-k="8000">8000K</button>
    </div>
    <div class="row"><label for="kelvin">色温</label><input id="kelvin" type="range" min="2000" max="10000" step="50" value="5600"><output id="kOut">5600K</output></div>
    <div class="row"><label for="tint">± G/M</label><input id="tint" type="range" min="-100" max="100" step="1" value="0"><output id="tOut">0</output></div>
  </div>

  <div id="rgbBox" style="display:none;gap:10px">
    <div class="row"><label for="hue">色相</label><input id="hue" type="range" min="0" max="360" step="1" value="210"><output id="hOut">210°</output></div>
    <div class="row"><label for="sat">饱和度</label><input id="sat" type="range" min="0" max="100" step="1" value="100"><output id="sOut">100%</output></div>
  </div>

  <div class="row"><label for="level">亮度</label><input id="level" type="range" min="5" max="100" step="1" value="100"><output id="lOut">100%</output></div>

  <div class="tools">
    <button id="promptBtn">提词器</button>
    <button id="sizeBtn">放大画面</button>
    <button id="mirrorBtn">镜像 开</button>
    <button id="camBtn">关闭画面</button>
    <button id="hideBtn">隐藏面板</button>
  </div>
</div>

<!-- 提词器设置 -->
<div id="promptSheet" class="sheet">
  <div class="sheetHead"><b>提词器</b><button id="promptDone">完成</button></div>
  <textarea id="promptInput" placeholder="把你的稿子粘贴在这里"></textarea>
  <div class="row"><label for="pSpeed">速度</label><input id="pSpeed" type="range" min="5" max="120" step="1" value="35"><output id="psOut">35</output></div>
  <div class="row"><label for="pSize">字号</label><input id="pSize" type="range" min="18" max="56" step="1" value="28"><output id="pzOut">28</output></div>
  <label class="check"><input type="checkbox" id="pShow" checked> 在屏幕上显示提词</label>
  <label class="check"><input type="checkbox" id="pAuto" checked> 开始录制时自动滚动</label>
  <div class="btnRow">
    <button id="pReset">回到开头</button>
    <button id="pPlay" class="primary">开始滚动</button>
  </div>
</div>

<div id="hint"></div>
<label id="hapticLbl"><input type="checkbox" switch id="hapticSw"></label>

<div id="review" hidden>
  <video id="playback" playsinline controls></video>
  <div class="acts">
    <button id="discardBtn">删除</button>
    <a id="dlLink" download="selfie.mp4">下载</a>
    <button id="shareBtn" class="primary">保存 / 分享</button>
  </div>
</div>

<div id="start">
  <div>
    <div class="bulb"></div>
    <h1>Screen Light+</h1>
    <p>整个屏幕变成补光灯，画面缩到右上角</p>
    <p>建议先把手机亮度调到最高，关掉自动亮度和原彩</p>
    <div class="startBtns">
      <button id="goBtn">打开相机</button>
      <button id="lightOnlyBtn">只用灯</button>
    </div>
    <div id="err" hidden></div>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const light=$('light'), cam=$('cam'), pip=$('pip'), panel=$('panel'), pSheet=$('promptSheet');
  const kelvin=$('kelvin'), tint=$('tint'), level=$('level'), hue=$('hue'), sat=$('sat');
  let stream=null, recorder=null, chunks=[], recStart=0, timer=null, wakeLock=null, lastBlob=null, lastUrl=null, lastExt='mp4';
  let mode='cct';

  const store={
    get(k,d){ try{ const v=localStorage.getItem('slp_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem('slp_'+k,JSON.stringify(v)); }catch(e){} }
  };

  function hint(t){ const h=$('hint'); h.textContent=t; h.classList.add('show'); clearTimeout(hint._t); hint._t=setTimeout(()=>h.classList.remove('show'),1600); }
  function haptic(){
    try{ if(navigator.vibrate&&navigator.vibrate(15)) return; }catch(e){}
    try{ $('hapticLbl').click(); }catch(e){}   // iOS 18+ Safari 的震动小技巧
  }

  /* ---------- 灯光颜色 ---------- */
  function k2rgb(k){
    const t=k/100; let r,g,b;
    if(t<=66){ r=255; g=99.4708025861*Math.log(t)-161.1195681661; b=t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307; }
    else { r=329.698727446*Math.pow(t-60,-0.1332047592); g=288.1221695283*Math.pow(t-60,-0.0755148492); b=255; }
    return [r,g,b].map(v=>Math.max(0,Math.min(255,v)));
  }
  function hsv2rgb(h,s,v){
    const f=n=>{ const k=(n+h/60)%6; return v-v*s*Math.max(0,Math.min(k,4-k,1)); };
    return [f(5),f(3),f(1)].map(x=>x*255);
  }
  function apply(){
    const l=+level.value/100; let rgb;
    if(mode==='cct'){
      const k=+kelvin.value, t=+tint.value/100;
      let [r,g,b]=k2rgb(k);
      if(t>0){ r*=1-0.3*t; b*=1-0.3*t; }    // 加绿
      else if(t<0){ g*=1+0.3*t; }            // 加品红
      const m=Math.max(r,g,b)||1;
      rgb=[r,g,b].map(v=>v/m*255*l);
      $('kOut').textContent=k+'K';
      $('tOut').textContent=t===0?'0':(t>0?'+'+Math.round(t*100)+' G':Math.round(-t*100)+' M');
      document.querySelectorAll('#presets button').forEach(bn=>bn.classList.toggle('active',+bn.dataset.k===k));
    } else {
      const h=+hue.value, s=+sat.value/100;
      rgb=hsv2rgb(h,s,l);
      $('hOut').textContent=h+'°'; $('sOut').textContent=Math.round(s*100)+'%';
      sat.style.setProperty('--hueColor',`hsl(${h},100%,50%)`);
    }
    rgb=rgb.map(Math.round);
    light.style.background=`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    $('lOut').textContent=Math.round(l*100)+'%';
    // 提词文字颜色跟着灯的亮度自动黑/白
    const lum=(0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2])/255;
    document.documentElement.style.setProperty('--ptext',lum>0.45?'rgba(0,0,0,.86)':'rgba(255,255,255,.92)');
    store.set('light',{mode,k:+kelvin.value,t:+tint.value,h:+hue.value,s:+sat.value,l:+level.value});
  }
  function setMode(m){
    mode=m;
    document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    $('cctBox').style.display=m==='cct'?'grid':'none';
    $('rgbBox').style.display=m==='rgb'?'grid':'none';
    apply(); syncPanelH();
  }
  const sl=store.get('light',null);
  if(sl){ kelvin.value=sl.k??5600; tint.value=sl.t??0; hue.value=sl.h??210; sat.value=sl.s??100; level.value=sl.l??100; mode=sl.mode||'cct'; }
  [kelvin,tint,level,hue,sat].forEach(el=>el.addEventListener('input',apply));
  tint.addEventListener('dblclick',()=>{ tint.value=0; apply(); });
  $('presets').addEventListener('click',e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){ kelvin.value=k; apply(); } });
  $('modeSeg').addEventListener('click',e=>{ const m=e.target.dataset&&e.target.dataset.m; if(m) setMode(m); });

  /* ---------- 面板 ---------- */
  let openSheet=panel;
  function syncPanelH(){
    const open=document.querySelector('.sheet.open');
    document.body.classList.toggle('sheet-open',!!open);
    if(open) document.body.style.setProperty('--panelH',open.offsetHeight+'px');
  }
  function show(sheet){ [panel,pSheet].forEach(s=>s.classList.toggle('open',s===sheet)); openSheet=sheet; syncPanelH(); }
  $('hideBtn').onclick=()=>{ show(null); hint('点屏幕任意处打开面板'); };
  light.addEventListener('click',()=>show(openSheet?null:panel));
  window.addEventListener('resize',()=>{ syncPanelH(); clampPip(); fitPrompter(); });

  /* ---------- 小画面：按住拖动 ---------- */
  let drag=null;
  function dragStart(x,y){
    const r=pip.getBoundingClientRect();
    drag={x0:x,y0:y,dx:x-r.left,dy:y-r.top,active:false};
    drag.t=setTimeout(()=>{ if(drag&&!drag.active) dragActivate(); },280);
  }
  function dragActivate(){ drag.active=true; pip.classList.add('lifted'); haptic(); }
  function dragMove(x,y){
    if(!drag) return;
    if(!drag.active){ if(Math.hypot(x-drag.x0,y-drag.y0)>6) dragActivate(); else return; }
    place(x-drag.dx,y-drag.dy);
  }
  function dragEnd(){
    if(!drag) return;
    clearTimeout(drag.t);
    if(drag.active){ pip.classList.remove('lifted'); settlePip(); savePip(); }
    drag=null;
  }
  pip.addEventListener('contextmenu',e=>e.preventDefault());
  pip.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.touches[0]; dragStart(t.clientX,t.clientY); },{passive:false});
  pip.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; dragMove(t.clientX,t.clientY); },{passive:false});
  pip.addEventListener('touchend',dragEnd);
  pip.addEventListener('touchcancel',dragEnd);
  pip.addEventListener('mousedown',e=>{
    dragStart(e.clientX,e.clientY);
    const mm=ev=>dragMove(ev.clientX,ev.clientY);
    const mu=()=>{ dragEnd(); removeEventListener('mousemove',mm); removeEventListener('mouseup',mu); };
    addEventListener('mousemove',mm); addEventListener('mouseup',mu);
  });
  // 松手时如果挡住提词器太多，就把画面放到字幕下面
  function settlePip(){
    if(prompter.hidden) return;
    const r=pip.getBoundingClientRect(), band=prompter.getBoundingClientRect();
    if(r.top<band.bottom-20&&r.bottom>band.top){
      const space=Math.max(r.left,innerWidth-r.right);
      if(space<innerWidth*0.5){ place(r.left,band.bottom+8); }
    }
  }

  function place(x,y){
    const w=pip.offsetWidth, h=pip.offsetHeight;
    x=Math.max(4,Math.min(innerWidth-w-4,x)); y=Math.max(4,Math.min(innerHeight-h-4,y));
    pip.style.left=x+'px'; pip.style.top=y+'px'; pip.style.right='auto';
    fitPrompter();
  }
  function savePip(){
    const r=pip.getBoundingClientRect();
    store.set('pip',{fx:r.left/innerWidth,fy:r.top/innerHeight});
  }
  function restorePip(){
    const p=store.get('pip',null);
    if(p) requestAnimationFrame(()=>place(p.fx*innerWidth,p.fy*innerHeight));
  }
  function clampPip(){ if(pip.style.left){ const r=pip.getBoundingClientRect(); place(r.left,r.top); } }

  if(store.get('big',false)){ pip.classList.add('big'); $('sizeBtn').textContent='缩小画面'; }
  $('sizeBtn').onclick=()=>{ const big=pip.classList.toggle('big'); $('sizeBtn').textContent=big?'缩小画面':'放大画面'; store.set('big',big); setTimeout(()=>{ clampPip(); fitPrompter(); },220); };
  if(store.get('mirror',true)===false){ pip.classList.add('nomirror'); $('mirrorBtn').textContent='镜像 关'; }
  $('mirrorBtn').onclick=()=>{ const off=pip.classList.toggle('nomirror'); $('mirrorBtn').textContent=off?'镜像 关':'镜像 开'; store.set('mirror',!off); };

  /* ---------- 相机开关 ---------- */
  function camUI(){
    const on=!!stream;
    pip.hidden=!on; $('recBtn').hidden=!on;
    $('camBtn').textContent=on?'关闭画面':'打开画面';
    ['sizeBtn','mirrorBtn'].forEach(id=>$(id).disabled=!on);
    ['sizeBtn','mirrorBtn'].forEach(id=>$(id).style.opacity=on?1:.4);
    fitPrompter(); syncPanelH();
  }
  async function startCam(){
    const err=$('err'); err.hidden=true;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      err.textContent='这个浏览器拿不到相机。请用 Safari 或 Chrome 打开，网址要是 https 开头。'; err.hidden=false; return false;
    }
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},
        audio:{echoCancellation:true,noiseSuppression:true}
      });
    }catch(e){
      try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true}); }
      catch(e2){ stream=null; err.textContent='没拿到相机或麦克风权限。去系统设置里允许浏览器使用相机和麦克风，然后刷新再试。'; err.hidden=false; return false; }
    }
    cam.srcObject=stream;
    try{ await cam.play(); }catch(e){}
    store.set('lastMode','cam');
    camUI(); restorePip();
    return true;
  }
  function stopCam(){
    if(recorder&&recorder.state==='recording'){ hint('先停止录制'); return; }
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=null; cam.srcObject=null; store.set('lastMode','light'); camUI(); hint('只用灯模式');
  }
  $('camBtn').onclick=async()=>{ if(stream) stopCam(); else { const ok=await startCam(); if(!ok) hint('没拿到相机权限'); } };

  async function keepAwake(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible') return;
    keepAwake();
    // 切回来时如果系统把相机断了，自动重新接上
    if(stream&&stream.getVideoTracks().some(t=>t.readyState==='ended')){ stream=null; await startCam(); }
  });

  $('goBtn').onclick=async()=>{ if(await startCam()){ $('start').hidden=true; keepAwake(); syncPanelH(); } };
  $('lightOnlyBtn').onclick=()=>{ store.set('lastMode','light'); $('start').hidden=true; keepAwake(); camUI(); };

  // 用过一次以后，打开直接进上次的模式，不再停在开始页
  (async()=>{
    const last=store.get('lastMode',null);
    if(last==='light'){ $('start').hidden=true; keepAwake(); camUI(); return; }
    let granted=false;
    try{ const p=await navigator.permissions.query({name:'camera'}); granted=p.state==='granted'; }catch(e){}
    if(last==='cam'||granted){
      $('start').hidden=true; keepAwake();
      if(!(await startCam())) $('start').hidden=false;
    }
  })();

  /* ---------- 提词器 ---------- */
  const prompter=$('prompter'), pText=$('prompterText'), pInput=$('promptInput');
  const SAMPLE='这是提词器的示例文字\n点下面的「提词器」按钮\n把这里换成你自己的稿子\n\n字幕会贴着前置摄像头往上滚\n读稿的时候眼睛就自然看着镜头\n\n点一下字幕可以暂停或继续';
  pInput.value=store.get('script',SAMPLE);
  $('pSpeed').value=store.get('pSpeed',35); $('pSize').value=store.get('pSize',28);
  $('pShow').checked=store.get('pShow',false); $('pAuto').checked=store.get('pAuto',true);
  let pOffset=0, pPlaying=false, pLast=0;

  function renderPrompter(){
    pText.textContent=pInput.value;
    pText.style.fontSize=$('pSize').value+'px';
    $('psOut').textContent=$('pSpeed').value; $('pzOut').textContent=$('pSize').value;
    const showIt=$('pShow').checked&&pInput.value.trim()!=='';
    prompter.hidden=!showIt;
    $('promptBtn').classList.toggle('on',showIt);
    updState(); fitPrompter();
  }
  function updState(){
    const s=$('pState');
    s.hidden=prompter.hidden||pPlaying||pOffset===0;
    $('pPlay').textContent=pPlaying?'暂停':'开始滚动';
  }
  function fitPrompter(){
    if(prompter.hidden) return;
    prompter.style.paddingLeft=prompter.style.paddingRight='';
    if(pip.hidden) return;
    const r=pip.getBoundingClientRect(), band=prompter.getBoundingClientRect();
    if(r.top<band.bottom-20&&r.bottom>band.top){
      // 字幕放到画面旁边空间大的那一边
      if(r.left>=innerWidth-r.right) prompter.style.paddingRight=(innerWidth-r.left+8)+'px';
      else prompter.style.paddingLeft=(r.right+8)+'px';
    }
  }
  const pMax=()=>Math.max(0,pText.scrollHeight-prompter.clientHeight*0.4);
  function tick(ts){
    if(!pPlaying) return;
    if(pt&&pt.moved){ pLast=ts; requestAnimationFrame(tick); return; }  // 手在拖的时候不自动走
    const dt=pLast?(ts-pLast)/1000:0; pLast=ts;
    pOffset+=(+$('pSpeed').value)*dt;
    if(pOffset>=pMax()){ pOffset=pMax(); setPlay(false); }
    pText.style.transform=`translateY(${-pOffset}px)`;
    requestAnimationFrame(tick);
  }
  // 手指上下拖动字幕
  let pt=null;
  function pStart(y){ pt={y0:y,off0:pOffset,moved:false}; }
  function pMove(y){
    if(!pt) return;
    const d=y-pt.y0;
    if(Math.abs(d)>6) pt.moved=true;
    if(!pt.moved) return;
    pOffset=Math.max(0,Math.min(pMax(),pt.off0-d));
    pText.style.transform=`translateY(${-pOffset}px)`;
  }
  function pEnd(){
    if(!pt) return;
    const moved=pt.moved; pt=null;
    if(!moved) setPlay(!pPlaying); else updState();
  }
  function setPlay(on){
    pPlaying=on; pLast=0;
    if(on) requestAnimationFrame(tick);
    updState();
  }
  function resetPrompter(){ setPlay(false); pOffset=0; pText.style.transform='translateY(0)'; updState(); }

  $('promptBtn').onclick=()=>{ if(!$('pShow').checked){ $('pShow').checked=true; store.set('pShow',true); renderPrompter(); } show(pSheet); };
  $('promptDone').onclick=()=>show(panel);
  pInput.addEventListener('input',()=>{ store.set('script',pInput.value); renderPrompter(); });
  $('pSpeed').addEventListener('input',()=>{ store.set('pSpeed',+$('pSpeed').value); renderPrompter(); });
  $('pSize').addEventListener('input',()=>{ store.set('pSize',+$('pSize').value); renderPrompter(); });
  $('pShow').addEventListener('change',()=>{ store.set('pShow',$('pShow').checked); renderPrompter(); });
  $('pAuto').addEventListener('change',()=>store.set('pAuto',$('pAuto').checked));
  $('pReset').onclick=resetPrompter;
  $('pPlay').onclick=()=>{ if(!pPlaying&&pOffset>=pText.scrollHeight-prompter.clientHeight*0.4-1) resetPrompter(); setPlay(!pPlaying); if(pPlaying) show(null); };
  prompter.addEventListener('touchstart',e=>{ e.preventDefault(); pStart(e.touches[0].clientY); },{passive:false});
  prompter.addEventListener('touchmove',e=>{ e.preventDefault(); pMove(e.touches[0].clientY); },{passive:false});
  prompter.addEventListener('touchend',pEnd);
  prompter.addEventListener('touchcancel',pEnd);
  prompter.addEventListener('mousedown',e=>{
    pStart(e.clientY);
    const mm=ev=>pMove(ev.clientY);
    const mu=()=>{ pEnd(); removeEventListener('mousemove',mm); removeEventListener('mouseup',mu); };
    addEventListener('mousemove',mm); addEventListener('mouseup',mu);
  });
  renderPrompter();

  /* ---------- 录制 ---------- */
  function pickType(){
    if(!window.MediaRecorder) return null;
    const list=['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    for(const t of list){ if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)) return t; }
    return '';
  }
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

  $('recBtn').onclick=()=>{
    if(!stream) return;
    if(recorder&&recorder.state==='recording'){ recorder.stop(); return; }
    const type=pickType();
    if(type===null){ hint('这个浏览器不支持录像'); return; }
    chunks=[];
    try{ recorder=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:8000000}:undefined); }
    catch(e){ recorder=new MediaRecorder(stream); }
    lastExt=(recorder.mimeType||type||'').includes('webm')?'webm':'mp4';
    recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      clearInterval(timer); $('recBadge').hidden=true; $('recBtn').classList.remove('on');
      setPlay(false);
      lastBlob=new Blob(chunks,{type:recorder.mimeType||('video/'+lastExt)});
      if(lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl=URL.createObjectURL(lastBlob);
      const name='selfie-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.'+lastExt;
      $('playback').src=lastUrl; $('dlLink').href=lastUrl; $('dlLink').download=name; $('dlLink').dataset.name=name;
      $('review').hidden=false;
    };
    recorder.start(1000);
    recStart=Date.now(); $('recTime').textContent='00:00'; $('recBadge').hidden=false; $('recBtn').classList.add('on');
    timer=setInterval(()=>{ $('recTime').textContent=fmt(Math.floor((Date.now()-recStart)/1000)); },500);
    show(null);
    if(!prompter.hidden&&$('pAuto').checked){ resetPrompter(); setPlay(true); }
  };

  $('shareBtn').onclick=async()=>{
    if(!lastBlob) return;
    const file=new File([lastBlob],$('dlLink').dataset.name,{type:lastBlob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); }catch(e){} }
    else $('dlLink').click();
  };
  $('discardBtn').onclick=()=>{ $('review').hidden=true; $('playback').pause(); resetPrompter(); };

  setMode(mode);
  syncPanelH();
})();
</script>
</body>
</html>
